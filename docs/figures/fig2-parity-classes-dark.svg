<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" role="img" aria-label="Rows and columns tie white to black; diagonals stay inside one color" font-size="13" width="760" height="388" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#0d1117"/><text x="24" y="28" font-size="15" font-weight="600" fill="#e6edf3">Rows and columns tie white to black; diagonals stay inside one color</text><text x="24" y="48" font-size="11.5" fill="#9198a1">Squares grouped by the parity of row and column; in the notes, EE also stands for the number of queens in class EE</text><g><rect x="24" y="64" width="256" height="252" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="40" y="88" font-weight="600" fill="#e6edf3">White squares: r + c even</text></g><g><rect x="480" y="64" width="256" height="252" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.25"></rect><text x="496" y="88" font-weight="600" fill="#e6edf3">Black squares: r + c odd</text></g><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M232 140H528"></path><path d="M232 264H528"></path><path d="M232 156L528 248"></path><path d="M528 156L232 248"></path></g><g fill="none" stroke="#58a6ff" stroke-width="2.5"><path d="M152 168V236"></path><path d="M608 168V236"></path></g><text x="380" y="132" text-anchor="middle" font-size="11.5" fill="#9198a1">rows</text><text x="380" y="256" text-anchor="middle" font-size="11.5" fill="#9198a1">rows</text><text x="380" y="180" text-anchor="middle" font-size="11.5" fill="#9198a1">columns</text><text x="162" y="206" font-size="11.5" font-weight="600" fill="#e6edf3">diagonals</text><text x="618" y="206" font-size="11.5" font-weight="600" fill="#e6edf3">diagonals</text><g><rect x="72" y="112" width="160" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="152" y="136" text-anchor="middle" font-weight="600" fill="#e6edf3">EE</text><text x="152" y="152" text-anchor="middle" font-size="11.5" fill="#9198a1">even row, even column</text></g><g><rect x="72" y="236" width="160" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="152" y="260" text-anchor="middle" font-weight="600" fill="#e6edf3">OO</text><text x="152" y="276" text-anchor="middle" font-size="11.5" fill="#9198a1">odd row, odd column</text></g><g><rect x="528" y="112" width="160" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="608" y="136" text-anchor="middle" font-weight="600" fill="#e6edf3">EO</text><text x="608" y="152" text-anchor="middle" font-size="11.5" fill="#9198a1">even row, odd column</text></g><g><rect x="528" y="236" width="160" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="608" y="260" text-anchor="middle" font-weight="600" fill="#e6edf3">OE</text><text x="608" y="276" text-anchor="middle" font-size="11.5" fill="#9198a1">odd row, even column</text></g><text x="24" y="344" font-size="11.5" fill="#e6edf3">Each even row and each even column holds one queen, so EE + EO = EE + OE = the number of even rows: hence EO = OE.</text><text x="24" y="362" font-size="11.5" fill="#e6edf3">With OE + OO = the number of odd rows, EE − OO = even rows − odd rows, which is 0 or 1 (Lemma 1).</text></svg>