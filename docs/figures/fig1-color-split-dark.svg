iddle" font-size="10.5" fill="#9198a1">7</text></g><circle cx="643" cy="129" r="7" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.75"><title>black queen: row 1, column 4</title></circle><circle cx="709" cy="151" r="7" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.75"><title>black queen: row 2, column 7</title></circle><circle cx="687" cy="217" r="7" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.75"><title>black queen: row 5, column 6</title></circle><circle cx="577" cy="239" r="7" fill="#e6edf3" stroke="#e6edf3" stroke-width="1.75"><title>black queen: row 6, column 1</title></circle></g><text x="128" y="296" text-anchor="middle" font-weight="600" fill="#e6edf3">Full solution</text><text x="128" y="314" text-anchor="middle" font-size="11.5" fill="#9198a1">8 queens, no two attacking</text><text x="380" y="296" text-anchor="middle" font-weight="600" fill="#e6edf3">White part</text><text x="380" y="314" text-anchor="middle" font-size="11.5" fill="#9198a1">rows R = {0, 3, 4, 7}</text><text x="380" y="330" text-anchor="middle" font-size="11.5" fill="#9198a1">columns C = {0, 2, 3, 5}</text><text x="632" y="296" text-anchor="middle" font-weight="600" fill="#e6edf3">Black part</text><text x="632" y="314" text-anchor="middle" font-size="11.5" fill="#9198a1">rows ~R = {1, 2, 5, 6}</text><text x="632" y="330" text-anchor="middle" font-size="11.5" fill="#9198a1">columns ~C = {1, 4, 6, 7}</text><text x="24" y="362" font-size="11.5" fill="#e6edf3">Every diagonal has one color, so the two parts never attack each other along a diagonal.</text><text x="24" y="380" font-size="11.5" fill="#e6edf3">They combine into a solution exactly when the black part takes the rows and columns the white part leaves free.</text></svg>