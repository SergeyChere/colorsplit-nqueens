<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-label="White placements fill a table; each black placement reads one entry" font-size="13" width="760" height="328" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="pair-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">White placements fill a table; each black placement reads one entry</text><text x="24" y="48" font-size="11.5" fill="#59636e">One term of the sum, for one row set R, as in Algorithm 2</text><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M108 146V120H221" marker-end="url(#pair-arrow)"></path><path d="M108 234V260H221" marker-end="url(#pair-arrow)"></path><path d="M442 120H467" marker-end="url(#pair-arrow)"></path><path d="M442 260H467" marker-end="url(#pair-arrow)"></path><path d="M592 164V215" marker-end="url(#pair-arrow)"></path></g><text x="584" y="194" text-anchor="end" font-size="11.5" fill="#59636e">read T[~D] for each black placement</text><g><rect x="24" y="146" width="168" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="40" y="170" font-weight="600" fill="#1f2328">Row set R</text><text x="40" y="186" font-size="11.5" fill="#59636e">rows of white queens</text><text x="40" y="202" font-size="11.5" fill="#59636e">obeys the parity law</text><text x="40" y="218" font-size="11.5" fill="#59636e">smallest in its orbit</text></g><g><rect x="222" y="76" width="220" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="244" cy="96" r="5.5" fill="none" stroke="#1f2328" stroke-width="1.5"></circle><text x="256" y="100" font-weight="600" fill="#1f2328">Build: white queens</text><text x="238" y="116" font-size="11.5" fill="#59636e">one queen in each row of R</text><text x="238" y="132" font-size="11.5" fill="#59636e">bitmask DFS, center-out rows</text><text x="238" y="148" font-size="11.5" fill="#59636e">pairs of weight 0 cut early</text></g><g><rect x="468" y="76" width="248" height="88" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="484" y="100" font-weight="600" fill="#1f2328">Table T[C]</text><text x="484" y="116" font-size="11.5" fill="#1f2328">count of white placements</text><text x="484" y="132" font-size="11.5" fill="#1f2328">with column set C</text><text x="484" y="148" font-size="11.5" fill="#1f2328">weight λ = 2, 1 or 0 per key</text></g><g><rect x="222" y="216" width="220" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="244" cy="236" r="5.5" fill="#1f2328" stroke="#1f2328" stroke-width="1.5"></circle><text x="256" y="240" font-weight="600" fill="#1f2328">Probe: black queens</text><text x="238" y="256" font-size="11.5" fill="#59636e">one queen in each row of ~R</text><text x="238" y="272" font-size="11.5" fill="#59636e">even rows first, then odd</text><text x="238" y="288" font-size="11.5" fill="#59636e">cut if the half key is absent</text></g><g><rect x="468" y="216" width="248" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="484" y="240" font-weight="600" fill="#1f2328">PairSum(R) = Σ T[~D]</text><text x="484" y="256" font-size="11.5" fill="#59636e">D = columns of a black placement</text><text x="484" y="272" font-size="11.5" fill="#59636e">total += w · PairSum(R)</text><text x="484" y="288" font-size="11.5" fill="#59636e">w = size of the orbit of R</text></g></svg>